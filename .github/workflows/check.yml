# Continuous integration: on every push and pull request, GitHub checks the
# project (formatting, lint, unit tests, interface tests). The result shows
# next to each commit: green check or red cross.
name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Development dependencies
        run: npm ci

      - name: Formatting, lint, unit tests
        run: npm run check

      - name: Browser for interface tests
        run: npx playwright install --with-deps chromium

      - name: Interface tests
        run: npm run test:e2e

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-test-report
          path: test-results/
          retention-days: 7
