<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Carnet de portées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Noto+Music&display=swap">
<style>
/* Layout: one narrow column of note "pages"; staff blocks sit between text blocks; a fixed input palette docks at the bottom while a staff is active. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#151A25; --muted:#5B6477; --line:#8D96A9; --rule:#DCE1EA;
  --accent:#2B47C9; --accent-soft:#E3E8FB; --sel:#D58300; --danger:#C2362B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-music:"Noto Music", "Noto Sans Symbols 2", "Segoe UI Symbol", serif;
  --pal-h:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1218; --surface:#171B24; --ink:#E7EAF1; --muted:#9AA3B5; --line:#6E778A; --rule:#2A303C;
  --accent:#93A6FF; --accent-soft:#222A48; --sel:#FFB52E; --danger:#FF7466; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#171B24; --ink:#E7EAF1; --muted:#9AA3B5; --line:#6E778A; --rule:#2A303C;
  --accent:#93A6FF; --accent-soft:#222A48; --sel:#FFB52E; --danger:#FF7466; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(32px + var(--pal-h))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;min-height:52px}
.top .grow{flex:1;min-width:0}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.1;margin:0}
.status{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.confirm{background:var(--danger);border-color:var(--danger);color:var(--surface)}

/* list */
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;overflow:hidden}
.card h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;text-wrap:balance}
.card .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;margin-top:2px}
.card .snip{color:var(--muted);margin:6px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .thumb{margin-top:6px;pointer-events:none}
.empty{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-top:6px}
.empty h2{font-family:var(--f-display);font-size:20px;margin:0 0 4px}
.empty p{margin:0 0 10px;color:var(--muted);max-width:60ch}
.empty .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.backup{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule)}
.backup p{margin:4px 0 10px;color:var(--muted);max-width:60ch}
.backup .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* note */
[hidden]{display:none!important}
.title-in{width:100%;border:0;resize:none;overflow:hidden;background:transparent;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;padding:4px 0 10px;outline:none}
.title-in::placeholder{color:var(--line)}
.blocks{display:flex;flex-direction:column;gap:10px}
.block{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-width:0}
.block.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.block.text{background:transparent;border-color:transparent;padding:2px 2px}
.block.text.active{background:var(--surface);border-color:var(--rule);box-shadow:none}
.block textarea{width:100%;border:0;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.5;padding:4px 2px;display:block;min-height:1.5em;overflow:hidden}
.block textarea::placeholder{color:var(--line)}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.shead .kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:2px}
.shead select,.shead input{border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:4px 6px;min-height:32px;font-size:14px}
.shead input[type=number]{width:62px}
.shead .tempo{display:inline-flex;align-items:center;gap:3px;font-size:14px}
.shead .tempo .mus{font-family:var(--f-music);font-size:18px}
.chip{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:4px 10px;min-height:32px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.playbtn{margin-left:auto;border:0;background:var(--accent);color:var(--surface);border-radius:999px;min-height:34px;padding:0 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.playbtn.on{background:var(--ink)}
.staff-wrap{overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.staff-wrap svg{display:block}
.tools{display:none;gap:6px;justify-content:flex-end;margin-top:6px}
.block.active .tools{display:flex}
.tools button{border:1px solid var(--rule);background:var(--bg);border-radius:6px;min-height:32px;min-width:38px;padding:0 10px;font-size:13px}
.tools .confirm{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addbar .btn{flex:1;justify-content:center;min-width:70px;padding:8px 6px}
.notefoot{margin-top:24px;display:flex;justify-content:center}

/* staff svg classes */
svg .l{stroke:var(--line);stroke-width:1}
svg .bar{stroke:var(--ink);stroke-width:1.2}
svg .f{fill:var(--ink)}
svg .s{stroke:var(--ink);fill:none}
svg .h{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
svg .t{fill:var(--ink);font-family:var(--f-display);font-weight:700}
svg .clef{fill:var(--ink);font-family:var(--f-music)}
svg .chord{fill:var(--ink);font-family:var(--f-body);font-weight:600;font-size:14px}
svg .mnum{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
svg .cursor{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
svg .cursorbg{fill:var(--accent-soft)}
svg .it.sel .f,svg .it.sel .chord{fill:var(--sel)}
svg .it.sel .s{stroke:var(--sel)}
svg .it.sel .h{stroke:var(--sel)}
svg .it.play .f,svg .it.play .chord{fill:var(--accent)}
svg .it.play .s,svg .it.play .h{stroke:var(--accent)}
svg .selbg{fill:var(--sel);opacity:.14}

/* palette */
#palette,#gpal{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(10,15,30,.12);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.pal-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-top:8px}
.pal-info{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-height:32px}
.pal-info span{flex:1;min-width:0}
.pal-info button{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:999px;padding:0 14px;min-height:32px}
.pal-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.pal-row button{min-height:46px;border:1px solid var(--rule);background:var(--bg);border-radius:8px;font-size:15px;padding:0;display:flex;align-items:center;justify-content:center;min-width:0}
.pal-row button.mus{font-family:var(--f-music);font-size:26px;line-height:1}
.pal-row button.restmode{color:var(--accent)}
.pal-row button.restmode[aria-pressed=true]{color:var(--surface)}
.pal-row button.accb{font-size:22px}
.pal-row button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pal-row .sep{border-left:2px solid var(--rule)}
.pal-bars{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.pal-bars button{min-height:52px;border:1px solid var(--rule);background:var(--bg);border-radius:8px;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;min-width:0;line-height:1.1}
.pal-bars button .mus{font-family:var(--f-music);font-size:24px;line-height:1}
.pal-bars button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pal-chord{display:flex;gap:6px}
/* grilles */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px;padding-top:12px;margin-top:4px}
.gm{position:relative;min-height:54px;border:0;border-left:1.5px solid var(--ink);background:transparent;padding:8px 4px 4px 7px;text-align:left;display:flex;align-items:center;min-width:0;border-radius:0;color:var(--ink)}
.gm.rb{border-right:1.5px solid var(--ink)}
.gm.lb-none{border-left:0}
.gm.lb-dbl{border-left:4px double var(--ink)}
.gm.lb-rs{border-left:4px solid var(--ink);padding-left:12px}
.gm.lb-rs::before,.gm.rb-re::after{content:"";position:absolute;top:50%;width:4px;height:14px;transform:translateY(-50%);background:radial-gradient(circle,var(--ink) 1.6px,transparent 1.9px) 0 0/4px 7px repeat-y}
.gm.lb-rs::before{left:3px}
.gm.rb-re{border-right:4px solid var(--ink);padding-right:10px}
.gm.rb-re::after{right:3px}
.gm.rb-dbl{border-right:4px double var(--ink)}
.gm.rb-fin{border-right:5px solid var(--ink);padding-right:9px}
.gm.rb-fin::after{content:"";position:absolute;right:3px;top:0;bottom:0;width:1.5px;background:var(--ink)}
.gm.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.gm.play{background:var(--accent-soft)}
.gm.add{border:1.5px dashed var(--rule);border-radius:6px;justify-content:center;color:var(--muted);font-size:22px;margin-left:6px;padding:0}
.gm .sec{position:absolute;top:-10px;left:-3px;font-family:var(--f-display);font-weight:700;font-size:11px;background:var(--ink);color:var(--surface);padding:0 4px;border-radius:3px;line-height:16px;z-index:1}
.gm .volta{position:absolute;top:-9px;left:14px;right:2px;height:10px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink);font-size:10px;font-weight:600;padding:1px 3px;line-height:1}
.gcs{display:flex;width:100%;gap:3px;min-width:0}
.gc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.1}
.gm.n2 .gc{font-size:15px}
.gm.n3 .gcs,.gm.n4 .gcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:3px;column-gap:2px}
.gm.n3 .gc,.gm.n4 .gc{font-size:13px;overflow:visible}
.gc sup{font-size:.62em;vertical-align:.5em;font-weight:600;margin-left:1px}
.gc .cb{font-size:.72em;font-weight:500}
.gc .slash{color:var(--line);font-weight:400}
.gc .nc{font-size:.72em}
.gc .bad{color:var(--danger);text-decoration:underline wavy}
.gm .sim{font-family:var(--f-music);font-size:26px;margin:auto;line-height:1}
.irealbox{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px;padding:10px;background:var(--bg);border-radius:8px}
.ir-actions{display:flex;gap:8px;flex-wrap:wrap}
.ir-lbl{font-size:13px;color:var(--muted)}
.block .irealbox textarea,.backup textarea{border:1px solid var(--rule);background:var(--surface);border-radius:6px;font-size:13px;padding:6px 8px;min-height:3.2em;overflow:auto;width:100%;font-family:ui-monospace,Menlo,monospace}
a.btn{text-decoration:none;color:inherit}
.g-row button{font-size:13px}
.g-row button.mus{font-family:var(--f-music);font-size:24px}
#gpal .pal-chord{display:flex}
#gIn.err{border-color:var(--danger)}
.version{font-size:12px;color:var(--muted);margin-top:18px}

.pal-chord input{flex:1;min-width:0;border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:16px;background:var(--bg)}
.pal-chord button{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:0 12px}
.pal-chord button.ok{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
@media (prefers-reduced-motion:no-preference){.block{transition:border-color .15s,box-shadow .15s}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<div id="palette" hidden>
  <div class="pal-inner">
    <div class="pal-info"><span id="palInfo"></span><button id="palDone" type="button">Terminé</button></div>
    <div class="pal-chord" id="chordBar" hidden>
      <input id="chordIn" placeholder="Accord, ex. Bb7, Cm7, F7alt" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="chordOk" class="ok" type="button">OK</button>
      <button id="chordCancel" type="button">Annuler</button>
    </div>
    <div class="pal-bars" id="barBar" hidden>
      <button type="button" data-bar="single"><span class="mus">&#x1D100;</span>Simple</button>
      <button type="button" data-bar="double"><span class="mus">&#x1D101;</span>Double</button>
      <button type="button" data-bar="final"><span class="mus">&#x1D102;</span>Fin</button>
      <button type="button" data-bar="rs"><span class="mus">&#x1D106;</span>Début rep.</button>
      <button type="button" data-bar="rep"><span class="mus">&#x1D107;</span>Fin rep.</button>
      <button type="button" data-bar="none"><span class="mus">&#x2715;</span>Aucune</button>
    </div>
    <div class="pal-row" id="rowDur">
      <button type="button" class="mus" data-dur="w" aria-label="Ronde">&#x1D15D;</button>
      <button type="button" class="mus" data-dur="h" aria-label="Blanche">&#x1D15E;</button>
      <button type="button" class="mus" data-dur="q" aria-label="Noire">&#x1D15F;</button>
      <button type="button" class="mus" data-dur="8" aria-label="Croche">&#x1D160;</button>
      <button type="button" class="mus" data-dur="16" aria-label="Double croche">&#x1D161;</button>
      <button type="button" data-act="dot" aria-label="Note pointée" style="font-size:26px;font-weight:700">&middot;</button>
      <button type="button" class="mus" data-act="rest" aria-label="Silence">&#x1D13D;</button>
      <button type="button" class="mus" data-act="bar" aria-label="Barres de mesure">&#x1D102;</button>
    </div>
    <div class="pal-row" id="rowMod">
      <button type="button" class="accb" data-acc="-1" aria-label="Bémol">&#x266D;</button>
      <button type="button" class="accb" data-acc="0" aria-label="Bécarre">&#x266E;</button>
      <button type="button" class="accb" data-acc="1" aria-label="Dièse">&#x266F;</button>
      <button type="button" data-act="chord" aria-label="Accord" style="font-weight:600;font-size:13px">Acc.</button>
      <button type="button" data-act="prev" aria-label="Note précédente">&#9664;</button>
      <button type="button" data-act="next" aria-label="Note suivante">&#9654;</button>
      <button type="button" data-act="undo" aria-label="Annuler" style="font-size:20px">&#8630;</button>
      <button type="button" data-act="del" aria-label="Effacer" style="font-size:20px">&#9003;</button>
    </div>
  </div>
</div>


<div id="gpal" hidden>
  <div class="pal-inner">
    <div class="pal-info"><span id="gInfo"></span><button id="gDone" type="button">Terminé</button></div>
    <div class="pal-chord">
      <input id="gIn" placeholder="Accords : Bb7 Eb7 · | = mesure suivante" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next">
      <button id="gOk" class="ok" type="button" aria-label="Mesure suivante">&#8629;</button>
    </div>
    <div class="pal-row g-row">
      <button type="button" data-g="sec">Section</button>
      <button type="button" data-g="end">Volta</button>
      <button type="button" class="mus" data-g="rs" aria-label="Début de reprise">&#x1D106;</button>
      <button type="button" class="mus" data-g="re" aria-label="Fin de reprise">&#x1D107;</button>
      <button type="button" class="mus" data-g="dbl" aria-label="Double barre">&#x1D101;</button>
      <button type="button" class="mus" data-g="fin" aria-label="Barre de fin">&#x1D102;</button>
    </div>
    <div class="pal-row g-row">
      <button type="button" data-g="prev" aria-label="Mesure précédente">&#9664;</button>
      <button type="button" data-g="next" aria-label="Mesure suivante">&#9654;</button>
      <button type="button" class="mus" data-g="sim" aria-label="Répéter la mesure précédente">&#x1D10E;</button>
      <button type="button" data-g="ins">+ Mes.</button>
      <button type="button" data-g="del">Suppr.</button>
      <button type="button" data-g="undo" aria-label="Annuler" style="font-size:20px">&#8630;</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const DUR={w:4,h:2,q:1,'8':.5,'16':.25};
const BASEW={w:46,h:34,q:27,'8':23,'16':21};
const H=5; // half space
const NAMES=['Do','Ré','Mi','Fa','Sol','La','Si'];
const SEMI=[0,2,4,5,7,9,11];
const CLEFBASE={treble:{L:2,O:4},bass:{L:4,O:2}};
const LS='carnet-portees-v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const qlen=it=>DUR[it.d]*(it.dot?1.5:1);
const mlen=t=>{const [n,d]=t.split('/').map(Number);return n*4/d;};
const beatUnit=t=>t.endsWith('/8')?1.5:1;
const mod=(a,n)=>((a%n)+n)%n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtChord=c=>c.replace(/([A-G])b/g,'$1♭').replace(/#/g,'♯');

/* ---------- state ---------- */
let notes={};
let view={name:'list',id:null};
let activeId=null, sel=null, playIdx=null;
const input={d:'q',dot:false,rest:false,acc:null,rs:false};
const hist={};
let syncMode='local', col=null, syncErr=false;

/* ---------- storage ---------- */
function lsRead(){try{return JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){return {}}}
let lsTimer=null;
function lsWrite(){clearTimeout(lsTimer);lsTimer=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(notes))}catch(e){}},150);}
const pack=n=>({title:n.title||'',updated:n.updated||0,body:JSON.stringify(n.blocks||[])});
function unpack(id,d){try{return {id,title:d.title||'',updated:d.updated||0,blocks:JSON.parse(d.body||'[]')}}catch(e){return null}}
const chains={},rTimers={};
function pushRemote(n){
  if(!col)return;
  const id=n.id;
  chains[id]=(chains[id]||Promise.resolve()).then(()=>{const cur=notes[id];if(!cur)return;return col.doc(id).set(pack(cur));}).then(()=>{if(syncErr){syncErr=false;updateStatus();}}).catch(()=>{syncErr=true;updateStatus();});
}
function save(n){
  n.updated=Date.now(); lsWrite();
  if(col){clearTimeout(rTimers[n.id]);rTimers[n.id]=setTimeout(()=>pushRemote(n),700);}
}
function removeNote(id){
  delete notes[id]; lsWrite();
  if(col){clearTimeout(rTimers[id]);chains[id]=(chains[id]||Promise.resolve()).then(()=>col.doc(id).delete()).catch(()=>{});}
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const c=db.collection('data/users/'+id+'/notes');
    const snap=await Promise.race([c.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    col=c;
    const remote={};
    snap.docs.forEach(d=>{if(d.exists){const n=unpack(d.id,d.data());if(n)remote[d.id]=n;}});
    Object.values(notes).forEach(n=>{const r=remote[n.id];if(!r||n.updated>r.updated)pushRemote(n);});
    let changed=false;
    Object.values(remote).forEach(r=>{const l=notes[r.id];if(!l||r.updated>l.updated){if(view.name==='note'&&view.id===r.id)return;notes[r.id]=r;changed=true;}});
    syncMode='db'; lsWrite();
    if(changed&&view.name==='list')render(); else updateStatus();
  }catch(e){col=null;syncMode='local';updateStatus();}
}
function statusText(){
    return 'Enregistré sur ce téléphone';
}
function updateStatus(){document.querySelectorAll('[data-status]').forEach(el=>el.textContent=statusText());}

/* ---------- history ---------- */
function pushHist(n){const h=hist[n.id]||(hist[n.id]=[]);h.push(JSON.stringify({t:n.title,b:n.blocks}));if(h.length>80)h.shift();}
function undo(){
  const n=notes[view.id];if(!n)return;const h=hist[n.id];if(!h||!h.length)return;
  const s=JSON.parse(h.pop());n.title=s.t;n.blocks=s.b;sel=null;
  if(activeId&&!n.blocks.some(b=>b.id===activeId))activeId=null;
  save(n);renderNote(true);
}

/* ---------- music helpers ---------- */
function midiOf(clef,s,acc){const b=CLEFBASE[clef]||CLEFBASE.treble;const t=b.L+s;return 12*(b.O+Math.floor(t/7)+1)+SEMI[mod(t,7)]+acc;}
function midis(b){
  const ML=mlen(b.time);let pos=0,carry={};
  return b.items.map(it=>{let m=null;
    if(it.rs&&pos>0){pos=0;carry={};}
    if(!it.r&&b.clef!=='rhythm'){if(it.a!=null)carry[it.s]=it.a;m=midiOf(b.clef,it.s,carry[it.s]??0);}
    pos+=qlen(it);if(it.bar||pos>=ML-1e-6){pos=0;carry={};}return m;});
}
function pitchName(clef,s,a){const b=CLEFBASE[clef]||CLEFBASE.treble;const t=b.L+s;const acc=a==null?'':a===-1?'♭':a===1?'♯':'♮';return NAMES[mod(t,7)]+acc+' '+(b.O+Math.floor(t/7));}

/* ---------- layout ---------- */
function layout(b,W,active){

  items.forEach((it,i)=>{
    if(it.rs&&cur.length){measures.push({idx:cur,full:true,type:'single'});cur=[];pos=0;}
    cur.push(i);pos+=qlen(it);

    else if(pos>=ML-1e-6){measures.push({idx:cur,full:true,type:'single'});cur=[];pos=0;}});

  systems.forEach((s,si)=>{

    let sc=1;if(s.used>avail)sc=avail/s.used;
    else if(!last&&s.used>0)sc=Math.min(avail/s.used,2.4);
    else if(last&&endedFinal&&s.used>avail*.5)sc=avail/s.used;

      m.idx.forEach(i=>{const it=items[i];const iw=widths[i]*sc;const off=(it.a!=null&&!it.r&&!rh?12:0)+8;pos2[i]={sys:si,x:x+off*Math.min(1,sc),x0:x,x1:x+iw};x+=iw;});

  const appendSys=systems.length-1,appendX=ended?null:(ls.ms.length?ls.end+8:ls.start+6);

function geom(L,si){
  const top=si*L.SH;

}
function accSvg(a,x,y){

  if(a===0)return `<path class="s" stroke-width="1.2" d="M${x-3} ${y-10}V${y+4}M${x+3} ${y-4}V${y+10}"/><path class="s" stroke-width="2.4" d="M${x-3} ${y-1.5}L${x+3} ${y-3.5}M${x-3} ${y+3.5}L${x+3} ${y+1.5}"/>`;

function barSvg(type,x,g,rh,start){

      else{out+=`<text class="t" x="46" y="${g.staffTop+17}" font-size="21" text-anchor="middle">${n}</text><text class="t" x="46" y="${g.staffTop+37}" font-size="21" text-anchor="middle">${d}</text>`;}

let playing=null;

    if(!it.r){if(b.clef==='rhythm')perc(ts,Math.abs(mpos/BU-Math.round(mpos/BU))<1e-6&&mpos<1e-6,playing.nodes);else tone(ts,te-ts,mids[i],playing.nodes);}
    playing.timers.push(setTimeout(()=>{playIdx=i;redrawStaff(b.id);},Math.max(0,(ts-c.currentTime)*1000)));
    q+=Lq;mpos+=Lq;if(it.bar||mpos>=ML-1e-6)mpos=0;
  });
  const endT=t0+(sw?warp(q):q)*spq;
  playing.timers.push(setTimeout(stopPlay,Math.max(0,(endT-c.currentTime)*1000+150)));
  updatePlayBtn(b.id);
}

function blockById(id){const n=curNote();return n?n.blocks.find(b=>b.id===id):null;}
function setActive(id){

function redrawStaff(id){
  const b=blockById(id);if(!b||b.type!=='staff')return;
  const wrap=app.querySelector(`[data-staff="${id}"]`);if(!wrap)return;
  const W=Math.max(220,wrap.clientWidth||300);
  const isAct=activeId===id;
  wrap.innerHTML=staffSvg(b,W,{sel:isAct?sel:null,play:playing&&playing.id===id?playIdx:null,cursor:isAct}).svg;

function staffTap(n,b,e){
  const wrap=e.currentTarget;const r=wrap.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  const wasActive=activeId===b.id;
  if(!wasActive){const prev=activeId;activeId=b.id;sel=null;if(prev)redrawStaff(prev);updateActive();
    const ae=document.activeElement;if(ae&&ae.blur&&ae!==document.body)ae.blur();}
  const L=layout(b,wrap._W||wrap.clientWidth,true);
  const si=Math.max(0,Math.min(L.systems.length-1,Math.floor(y/L.SH)));
  const g=geom(L,si);
  const sFromY=()=>Math.max(-6,Math.min(14,Math.round((g.staffBottom-y)/H)));
  let hit=-1;
  b.items.forEach((it,i)=>{const p=L.pos[i];if(p.sys===si&&x>=p.x0&&x<p.x1)hit=i;});
  if(hit>=0){
    const it=b.items[hit];
    if(sel===hit&&!it.r&&!L.rh){const s=sFromY();if(s!==it.s){pushHist(n);it.s=s;save(n);}preview(b,hit);}
    else{sel=hit;preview(b,hit);}
  }else if(L.appendX!=null&&si===L.appendSys&&x>=L.appendX-14){
    pushHist(n);
    const it={d:input.d};if(input.dot)it.dot=true;
    if(input.rest)it.r=true;else if(!L.rh){it.s=sFromY();if(input.acc!=null)it.a=input.acc;}
    if(input.rs){it.rs=true;input.rs=false;}
    b.items.push(it);input.acc=null;sel=null;save(n);preview(b,b.items.length-1);
  }else{sel=null;}
  redrawStaff(b.id);
}

const pal=document.getElementById('palette');

function applyBar(type){

  else{if(tgt<0)return;pushHist(n);const it=b.items[tgt];
    if(type==='none'){delete it.bar;delete it.rs;}else if(it.bar===type)delete it.bar;else it.bar=type;save(n);}

}
function showPalette(on){

function updatePalette(){
  const b=activeId&&blockById(activeId);if(!b||b.type!=='staff')return;
  const rh=b.clef==='rhythm';const it=sel!=null?b.items[sel]:null;
  const d=it?it.d:input.d,dot=it?!!it.dot:input.dot,rest=it?!!it.r:input.rest,acc=it?(it.a??null):input.acc;
  const GL=rest?{w:'\u{1D13B}',h:'\u{1D13C}',q:'\u{1D13D}','8':'\u{1D13E}','16':'\u{1D13F}'}:{w:'\u{1D15D}',h:'\u{1D15E}',q:'\u{1D15F}','8':'\u{1D160}','16':'\u{1D161}'};
  const LB=rest?{w:'Pause',h:'Demi-pause',q:'Soupir','8':'Demi-soupir','16':'Quart de soupir'}:{w:'Ronde',h:'Blanche',q:'Noire','8':'Croche','16':'Double croche'};
  pal.querySelectorAll('[data-dur]').forEach(x=>{x.setAttribute('aria-pressed',x.dataset.dur===d);x.textContent=GL[x.dataset.dur];x.setAttribute('aria-label',LB[x.dataset.dur]);x.classList.toggle('restmode',rest);});
  pal.querySelector('[data-act=dot]').setAttribute('aria-pressed',dot);
  pal.querySelector('[data-act=rest]').setAttribute('aria-pressed',rest);
  pal.querySelectorAll('[data-acc]').forEach(x=>{x.hidden=rh;x.setAttribute('aria-pressed',acc!=null&&String(acc)===x.dataset.acc);});
  pal.querySelector('[data-act=bar]').setAttribute('aria-pressed',!barBar.hidden);
  {const ti=sel!=null?b.items[sel]:b.items[b.items.length-1];
    barBar.querySelectorAll('[data-bar]').forEach(x=>{const t=x.dataset.bar;const on=t==='rs'?(sel!=null?!!(it&&it.rs):input.rs):(ti?(t==='none'?false:ti.bar===t):false);x.setAttribute('aria-pressed',on);});}
  const info=document.getElementById('palInfo');
  if(it){info.textContent=it.r?'Silence sélectionné':(rh?'Note sélectionnée':pitchName(b.clef,it.s,it.a)+' · touchez plus haut ou plus bas pour la déplacer');}
  else if(b.items.length&&b.items[b.items.length-1].bar==='final')info.textContent='Motif terminé · retirez la barre de fin pour continuer';
  else if(input.rs)info.textContent='La prochaine note ouvrira une reprise';
  else if(rest)info.textContent='Mode silence ('+LB[d].toLowerCase()+') · touchez la zone bleue pour l\'ajouter';
  else info.textContent=rh?'Touchez la zone bleue pour ajouter':'Touchez la portée dans la zone bleue pour ajouter';
  document.documentElement.style.setProperty('--pal-h',(pal.offsetHeight||170)+'px');
}
function withSel(fn){const n=curNote(),b=activeId&&blockById(activeId);if(!n||!b)return;const it=sel!=null?b.items[sel]:null;if(it){pushHist(n);fn(it,b);save(n);redrawStaff(b.id);return true;}return false;}
pal.addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  const n=curNote(),b=activeId&&blockById(activeId);if(!n||!b)return;
  if(btn.dataset.bar){applyBar(btn.dataset.bar);return;}
  if(btn.dataset.act==='bar'){barBar.hidden=!barBar.hidden;if(!barBar.hidden)closeChord();updatePalette();return;}
  if(btn.dataset.dur){const d=btn.dataset.dur;if(!withSel(it=>{it.d=d;})){input.d=d;updatePalette();}else preview(b,sel);return;}
  if(btn.dataset.acc!=null&&btn.dataset.acc!==undefined&&btn.hasAttribute('data-acc')){const a=Number(btn.dataset.acc);
    if(!withSel(it=>{if(it.r)return;if(it.a===a)delete it.a;else it.a=a;})){input.acc=input.acc===a?null:a;updatePalette();}else preview(b,sel);return;}
  const act=btn.dataset.act;
  if(act==='dot'){if(!withSel(it=>{if(it.dot)delete it.dot;else it.dot=true;})){input.dot=!input.dot;updatePalette();}return;}
  if(act==='rest'){if(!withSel(it=>{if(it.r){delete it.r;if(b.clef!=='rhythm')it.s=it.s??4;}else{it.r=true;}})){input.rest=!input.rest;updatePalette();}return;}
  if(act==='prev'||act==='next'){if(!b.items.length)return;if(sel==null)sel=act==='prev'?b.items.length-1:0;else sel=Math.max(0,Math.min(b.items.length-1,sel+(act==='prev'?-1:1)));redrawStaff(b.id);preview(b,sel);return;}

  let q=m[3].replace(/^(maj|Maj|MA|M(?=7|9|13|$)|\^)7?/,'Δ').replace(/^(min|mi|m(?!aj)|-)/,'–').replace(/^–(maj|Maj|Δ|\^)7?/,'–Δ')
    .replace(/^(–7b5|m7b5|ø7?|h7?)/,'ø').replace(/^(dim|o|°)/,'°').replace(/^aug/,'+').replace(/b/g,'♭').replace(/#/g,'♯');

}
function chordTones(c){
  const m=CH_RE.exec(c);if(!m)return null;

  const body=q.replace(/^(maj|Maj|MA|M|\^|Δ|∆|min|mi|m|-|ø|h|dim|o|°)/,'');

function gridOrder(M){
  const order=[];let i=0,rsI=0,pass=1;const jumped=new Set();
  while(i<M.length&&order.length<2000){
    const m=M[i];
    if(m.rs&&i!==rsI){rsI=i;pass=1;}
    if(m.ending===1&&pass===2){const j=M.findIndex((x,k)=>k>i&&x.ending===2);if(j>0){i=j;continue;}}
    order.push(i);
    if(m.re&&!jumped.has(i)){jumped.add(i);i=rsI;pass=2;continue;}
    if(m.fin)break;i++;
  }
  return order;
}
function pad(t,dur,midi,nodes){
  const c=actx();if(!c)return;const f=440*Math.pow(2,(midi-69)/12);
  const o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();
  o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;lp.type='lowpass';lp.frequency.value=Math.min(4000,f*3);
  const end=t+Math.max(.1,dur*.92);const v=.075;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.setTargetAtTime(v*.55,t+.05,.25);g.gain.setTargetAtTime(0,end,.05);
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(c.destination);o.start(t);o2.start(t);o.stop(end+.3);o2.stop(end+.3);nodes.push(o,o2);
}
function playGrid(b){
  const was=playing&&playing.id===b.id;stopPlay();if(was)return;
  const c=actx();if(!c||!b.measures.length)return;
  const spq=60/(b.tempo||120),ML=mlen(b.time);
  const swingy=/swing|waltz|blues|gospel|ballad/i.test(b.style);
  playing={id:b.id,timers:[],nodes:[]};
  const t0=c.currentTime+.15;let q=0,last=null,prevCh=[];
  gridOrder(b.measures).forEach(i=>{
    let ch=b.measures[i].ch;if(ch.length===1&&ch[0]==='%')ch=prevCh;else if(!ch.length)ch=last?[last]:[];
    prevCh=ch;
    const durs=slotDurs(Math.max(1,ch.length),b.time);let qq=q;
    ch.forEach((x,k)=>{const d=durs[k];
      if(x==='n'){last=null;}
      else{const cc=x===''?last:x;const tn=cc&&chordTones(cc);if(tn){last=cc;const ts=t0+qq*spq;
        tone(ts,Math.min(d*spq,spq*2),tn.bass-12+12,playing.nodes);tn.notes.forEach(nm=>pad(ts,d*spq,nm,playing.nodes));}}
      qq+=d;});
    if(swingy&&!b.time.endsWith('/8'))for(let bt=1;bt<ML;bt+=2)perc(t0+(q+bt)*spq,false,playing.nodes);
    playing.timers.push(setTimeout(()=>{playIdx=i;redrawGrid(b.id);},Math.max(0,(t0+q*spq-c.currentTime)*1000)));
    q+=ML;
  });
  playing.timers.push(setTimeout(stopPlay,Math.max(0,(t0+q*spq-c.currentTime)*1000+200)));
  updatePlayBtn(b.id);
}

function obf50(s){const a=s.split('');for(let i=0;i<5;i++){a[49-i]=s[i];a[i]=s[49-i];}for(let i=10;i<24;i++){a[49-i]=s[i];a[i]=s[49-i];}return a.join('');}
function irScramble(s){let r='',p=s;while(p.length>51){const t=p.slice(0,50);p=p.slice(50);r+=p.length<2?t:obf50(t);}return r+p;}

function qToIReal(q){
  let s=q.replace(/\s/g,'').replace(/[♭]/g,'b').replace(/[♯]/g,'#');
  s=s.replace(/^(min|mi|m(?!aj)|–)/,'-');
  s=s.replace(/(maj|Maj|MA|Δ|∆)/,'^').replace(/^M(?=7|9|13|$)/,'^');
  if(s==='^'||s==='-^')s+='7';
  s=s.replace(/^(ø7?|h(?!7)|-7b5)/,'h7').replace(/^(dim|°)/,'o').replace(/^aug/,'+');
  return s;
}
function qFromIReal(q){
  if(q.startsWith('^')){const r=q.slice(1);return 'maj'+(r===''?'7':r);}
  q=q.replace(/^-\^(\d*)/,(m,d)=>'mMaj'+(d||'7')).replace(/^-/,'m').replace(/^h7?/,'m7b5').replace(/^o/,'dim');
  return q;
}
function chordToIReal(c){
  if(c==='%')return 'x';if(c==='n')return 'n';if(c==='')return 'p';
  const m=CH_RE.exec(c);if(!m)return 'n';
  return m[1]+m[2].replace('♭','b').replace('♯','#')+qToIReal(m[3])+(m[4]?'/'+m[4].replace('♭','b').replace('♯','#'):'');
}
const TIMES={'4/4':'T44','3/4':'T34','2/4':'T24','5/4':'T54','6/8':'T68','12/8':'T12'};
function toIRealMusic(b){
  const M=b.measures;let s=TIMES[b.time]||'T44';
  M.forEach((m,i)=>{const p=M[i-1];
    if(p){if(p.re)s+='}';else if(p.fin)s+='Z';else if(p.dbl||m.sec||m.rs)s+=']';else s+='|';}
    if(m.sec)s+='*'+(m.sec==='Intro'?'i':m.sec[0]);
    if(m.rs)s+='{';else if(!p||m.sec||p.dbl||p.fin)s+='[';
    if(m.ending)s+='N'+m.ending;
    const ch=m.ch.map(chordToIReal);
    if(!ch.length)s+='    ';
    else if(ch.length===1)s+=ch[0]+'   ';
    else if(ch.length===2)s+=ch[0]+' '+ch[1]+' ';
    else if(ch.length===3)s+=ch[0]+' '+ch[1]+','+ch[2];
    else s+=ch.join(',');
  });
  const l=M[M.length-1];s+=l&&l.re?'}':' Z';
  return s;
}
function toIReal(title,b){
  const key=b.key||'C';
  const fields=[title,'Unknown','',b.style||'Medium Swing',key,'','1r34LbKcu7'+irScramble(toIRealMusic(b)),'',String(b.tempo||0),'0'];
  return 'irealb://'+fields.map(f=>encodeURIComponent(f)).join('=');
}
function parseIRealMusic(raw){
  const M=[];let cur=null,pend={},time='4/4';const T={T44:'4/4',T34:'3/4',T24:'2/4',T54:'5/4',T68:'6/8',T12:'12/8',T64:'6/4'};
  const open=()=>{if(!cur){cur={ch:[]};Object.assign(cur,pend);pend={};}return cur;};
  const close=flag=>{if(cur){if(flag)cur[flag]=true;M.push(cur);cur=null;}else if(flag&&M.length)M[M.length-1][flag]=true;};
  let s=raw.replace(/<[^>]*>/g,' ').replace(/\([^)]*\)/g,' ');let i=0;
  while(i<s.length){
    const r=s.slice(i);let mm;
    if((mm=/^T(\d\d)/.exec(r))){const t=T['T'+mm[1]];if(t&&!M.length)time=t;i+=3;continue;}
    if((mm=/^\*([A-Za-z])/.exec(r))){const v=mm[1]==='i'?'Intro':mm[1]==='V'?'Verse':mm[1].toUpperCase();if(cur&&!cur.ch.length)cur.sec=v;else pend.sec=v;i+=2;continue;}
    if((mm=/^N([0-3])/.exec(r))){const v=Number(mm[1]);if(v)open().ending=v;i+=2;continue;}
    const c0=r[0];
    if(c0==='{'){close();pend.rs=true;i++;continue;}
    if(c0==='['){close();i++;continue;}
    if(c0==='|'){close();i++;continue;}
    if(c0===']'){close('dbl');i++;continue;}
    if(c0==='}'){close('re');i++;continue;}
    if(c0==='Z'){close('fin');i++;continue;}
    if(c0==='x'){open().ch=['%'];i++;continue;}
    if(c0==='r'){close();M.push({ch:['%']},{ch:['%']});i++;continue;}
    if(c0==='n'){open().ch.push('n');i++;continue;}
    if(c0==='p'){open().ch.push('');i++;continue;}
    if((mm=/^([A-GW])([b#]?)([\^\-ho+0-9b#susaldtd]*)(\/[A-G][b#]?)?/.exec(r))&&mm[0].length){
      if(mm[1]==='W'){open().ch.push('');}else open().ch.push(mm[1]+mm[2]+qFromIReal(mm[3])+(mm[4]||''));
      i+=mm[0].length;continue;}
    i++;
  }
  close();
  while(M.length&&!M[M.length-1].ch.length&&!M[M.length-1].sec)M.pop();
  if(M.length&&M[M.length-1].fin===undefined&&!M[M.length-1].re)M[M.length-1].fin=true;
  M.forEach(m=>{if(m.re&&m.fin)delete m.fin;});
  return {time,measures:M};
}
function parseIRealAll(text){
  const urls=String(text).match(/irealb(?:ook)?:\/\/[^"'\s<>]+/g)||[];const out=[];
  urls.forEach(u=>{let d;try{d=decodeURIComponent(u.replace(/\+/g,'%20'));}catch(e){d=u;}
    const isB=d.startsWith('irealb://');d=d.replace(/^irealb(?:ook)?:\/\//,'');
    d.split('===').forEach(song=>{const p=song.split('=');if(p.length<6)return;
      let mi=p.findIndex(x=>x.startsWith('1r34LbKcu7'));let music,style,key,tempo=0;
      if(mi>=0){music=irUnscramble(p[mi].slice(10));style=p[mi-3]||'';key=p[mi-2]||'C';tempo=parseInt(p[mi+2],10)||0;}
      else if(!isB){music=p[5];style=p[2];key=p[3];}else return;
      const r=parseIRealMusic(music);if(!r.measures.length)return;
      out.push({title:p[0]||'Sans titre',composer:p[1]||'',style:style||'Medium Swing',key:key||'C',tempo:tempo>=30&&tempo<=300?tempo:0,time:r.time,measures:r.measures});});});
  return out;
}
function importIRealNotes(text){
  const songs=parseIRealAll(text);
  songs.forEach((s,k)=>{const g=newGrid();Object.assign(g,{time:s.time,key:s.key,style:s.style,tempo:s.tempo||120,measures:s.measures});
    const n={id:uid(),title:s.title,updated:Date.now()+k,blocks:[{id:uid(),type:'text',text:s.composer&&s.composer!=='Unknown'?s.composer.split(' ').reverse().join(' '):''},g]};
    notes[n.id]=n;save(n);});
  return songs.length;
}
