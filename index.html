<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content: the Android keyboard shrinks the page instead of covering the palettes -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)" />
    <!--
  Content Security Policy: what the page is allowed to load and run.
  - script-src 'self': only the app's .js files. A script injected into the
    HTML (onerror=…, inline <script>) is refused by the browser: it is the
    safety net if an escape was forgotten.
  - style-src 'unsafe-inline': needed for style="…" attributes and
    element.style (does not allow running code).
  - img-src data: blob:: images generated for export; font-src data:: embedded fonts.
  - media-src blob:: metronome audio generated in the page (2.10 spike, WAV output).
  - No other origin: the app contacts no third-party server.
-->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Inkline</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="inkline-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/list.css" />
    <link rel="stylesheet" href="css/note.css" />
    <link rel="stylesheet" href="css/staff.css" />
    <link rel="stylesheet" href="css/grid.css" />
    <link rel="stylesheet" href="css/share.css" />
    <link rel="stylesheet" href="css/options.css" />
    <link rel="stylesheet" href="css/list-views.css" />
    <link rel="stylesheet" href="css/folders.css" />
    <link rel="stylesheet" href="css/fold.css" />
    <link rel="stylesheet" href="css/training.css" />
    <link rel="stylesheet" href="css/staff-modes.css" />
    <link rel="stylesheet" href="css/chord-keys.css" />
    <link rel="stylesheet" href="css/metro-spike.css" />
  </head>
  <body>
    <!-- Screens (home, note, settings…) are rendered here by js/ui/nav.js -->
    <div class="wrap" id="app"></div>

    <!-- Staff palette (js/ui/staff/palette.js). Visible when a staff block is active. -->
    <div id="palette" hidden>
      <div class="pal-inner">
        <div class="pal-info">
          <div data-i18n-attr="aria-label:pal.mode" class="modesw" role="radiogroup" aria-label="Mode">
            <button type="button" role="radio" data-mode="write" aria-checked="true" data-i18n="pal.write">
              Écrire
            </button>
            <button type="button" role="radio" data-mode="edit" aria-checked="false" data-i18n="pal.edit">
              Modifier
            </button>
          </div>
          <span class="grow"></span>
          <button
            data-i18n-attr="aria-label:common.undo"
            type="button"
            class="icon"
            data-act="undo"
            aria-label="Annuler"
          >
            &#8630;
          </button>
          <button
            data-i18n-attr="aria-label:pal.deleteNote"
            type="button"
            class="icon"
            data-act="del"
            aria-label="Effacer la note"
          >
            &#9003;
          </button>
          <button data-i18n="common.done" id="palDone" type="button">Terminé</button>
        </div>
        <div class="pal-hint" id="palInfo" role="status"></div>
        <div id="chordBar" hidden>
          <div class="ck-head">
            <span data-i18n="chord.title">Accord de la note</span>
            <button data-i18n="common.cancel" id="chordCancel" type="button">Annuler</button>
          </div>
          <div class="pal-chord" id="chordText" hidden>
            <input
              data-i18n-attr="placeholder:chord.placeholder"
              id="chordIn"
              placeholder="Accord, ex. Bb7, Cm7, F7alt"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
            />
            <button data-i18n="common.ok" id="chordOk" class="ok" type="button">OK</button>
            <button
              data-i18n-attr="aria-label:chordKb.keyboard"
              id="chordKb"
              type="button"
              aria-label="Clavier d'accords"
            >
              &#9835;
            </button>
          </div>
          <div class="ck" id="chordKeys"></div>
        </div>
        <div class="pal-bars" id="barBar" hidden>
          <button type="button" data-bar="single">
            <span class="mus">&#x1D100;</span><span data-i18n="bar.single">Simple</span>
          </button>
          <button type="button" data-bar="double">
            <span class="mus">&#x1D101;</span><span data-i18n="bar.doubleShort">Double</span>
          </button>
          <button type="button" data-bar="final">
            <span class="mus">&#x1D102;</span><span data-i18n="bar.finalShort">Fin</span>
          </button>
          <button type="button" data-bar="rs">
            <span class="mus">&#x1D106;</span><span data-i18n="bar.repStartShort">Début rep.</span>
          </button>
          <button type="button" data-bar="rep">
            <span class="mus">&#x1D107;</span><span data-i18n="bar.repEndShort">Fin rep.</span>
          </button>
          <button type="button" data-bar="none">
            <span class="mus">&#x2715;</span><span data-i18n="bar.none">Aucune</span>
          </button>
        </div>
        <div class="pal-row">
          <button data-i18n-attr="aria-label:dur.w" type="button" class="mus" data-dur="w" aria-label="Ronde">
            &#x1D15D;
          </button>
          <button
            data-i18n-attr="aria-label:dur.h"
            type="button"
            class="mus"
            data-dur="h"
            aria-label="Blanche"
          >
            &#x1D15E;
          </button>
          <button data-i18n-attr="aria-label:dur.q" type="button" class="mus" data-dur="q" aria-label="Noire">
            &#x1D15F;
          </button>
          <button
            data-i18n-attr="aria-label:dur.8"
            type="button"
            class="mus"
            data-dur="8"
            aria-label="Croche"
          >
            &#x1D160;
          </button>
          <button
            data-i18n-attr="aria-label:dur.16"
            type="button"
            class="mus"
            data-dur="16"
            aria-label="Double croche"
          >
            &#x1D161;
          </button>
          <button
            data-i18n-attr="aria-label:pal.dot"
            type="button"
            data-act="dot"
            aria-label="Note pointée"
            style="font-size: 26px; font-weight: 700"
          >
            &middot;
          </button>
          <button
            data-i18n-attr="aria-label:pal.triplet"
            type="button"
            class="tupb"
            data-act="tup"
            aria-label="Triolet"
          >
            3
          </button>
          <button
            data-i18n-attr="aria-label:pal.rest"
            type="button"
            class="mus"
            data-act="rest"
            aria-label="Silence"
          >
            &#x1D13D;
          </button>
        </div>
        <div class="pal-row">
          <button
            data-i18n-attr="aria-label:pal.tie"
            type="button"
            class="tieb"
            data-act="tie"
            aria-label="Liaison de prolongation"
          >
            <svg width="28" height="14" viewBox="0 0 28 14" aria-hidden="true">
              <path d="M2 3 Q14 15 26 3 Q14 11.5 2 3 Z" fill="currentColor" />
            </svg>
          </button>
          <button
            data-i18n-attr="aria-label:acc.flat"
            type="button"
            class="accb"
            data-acc="-1"
            aria-label="Bémol"
          >
            &#x266D;
          </button>
          <button
            data-i18n-attr="aria-label:acc.natural"
            type="button"
            class="accb"
            data-acc="0"
            aria-label="Bécarre"
          >
            &#x266E;
          </button>
          <button
            data-i18n-attr="aria-label:acc.sharp"
            type="button"
            class="accb"
            data-acc="1"
            aria-label="Dièse"
          >
            &#x266F;
          </button>
          <button
            data-i18n-attr="aria-label:pal.barlines"
            type="button"
            class="mus"
            data-act="bar"
            aria-label="Barres de mesure"
          >
            &#x1D102;
          </button>
          <button
            data-i18n="pal.chordShort"
            data-i18n-attr="aria-label:pal.chord"
            type="button"
            data-act="chord"
            aria-label="Accord chiffré"
            style="font-weight: 600; font-size: 13px"
          >
            Acc.
          </button>
          <button
            data-i18n-attr="aria-label:pal.prevNote"
            type="button"
            data-act="prev"
            aria-label="Note précédente"
          >
            &#9664;
          </button>
          <button
            data-i18n-attr="aria-label:pal.nextNote"
            type="button"
            data-act="next"
            aria-label="Note suivante"
          >
            &#9654;
          </button>
        </div>
      </div>
    </div>

    <!-- Chart palette (js/ui/grid-ui.js). Visible when a chart block is active. -->
    <div id="gpal" hidden>
      <div class="pal-inner">
        <div class="pal-info">
          <span id="gInfo"></span>
          <button
            data-i18n-attr="aria-label:grid.prevMeasure"
            type="button"
            class="icon"
            data-g="prev"
            aria-label="Mesure précédente"
          >
            &#9664;
          </button>
          <button
            data-i18n-attr="aria-label:grid.nextMeasure"
            type="button"
            class="icon"
            data-g="next"
            aria-label="Mesure suivante"
          >
            &#9654;
          </button>
          <button data-i18n="common.done" id="gDone" type="button">Terminé</button>
        </div>
        <div
          data-i18n-attr="aria-label:grid.palette"
          class="ck-tabs"
          role="tablist"
          aria-label="Palette de grille"
        >
          <button
            data-i18n="grid.tabChords"
            type="button"
            role="tab"
            id="gTabChords"
            aria-selected="true"
            aria-controls="gChords"
          >
            Accords
          </button>
          <button
            data-i18n="grid.tabStruct"
            type="button"
            role="tab"
            id="gTabStruct"
            aria-selected="false"
            aria-controls="gStruct"
          >
            Structure
          </button>
        </div>
        <div id="gChords" role="tabpanel" aria-labelledby="gTabChords">
          <div class="pal-chord" id="gText" hidden>
            <input
              data-i18n-attr="placeholder:grid.inputPlaceholder"
              id="gIn"
              placeholder="Accords : Bb7 Eb7 · | = mesure suivante"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="next"
            />
            <button
              data-i18n-attr="aria-label:grid.nextMeasure"
              id="gOk"
              class="ok"
              type="button"
              aria-label="Mesure suivante"
            >
              &#8629;
            </button>
            <button
              data-i18n-attr="aria-label:chordKb.keyboard"
              id="gKb"
              type="button"
              aria-label="Clavier d'accords"
            >
              &#9835;
            </button>
          </div>
          <div class="ck" id="gKeys"></div>
        </div>
        <div id="gStruct" role="tabpanel" aria-labelledby="gTabStruct" hidden>
          <div class="pal-row g-row">
            <button data-i18n="grid.section" type="button" data-g="sec">Section</button>
            <button data-i18n="grid.volta" type="button" data-g="end">Volta</button>
            <button
              data-i18n-attr="aria-label:bar.repStart"
              type="button"
              class="mus"
              data-g="rs"
              aria-label="Début de reprise"
            >
              &#x1D106;
            </button>
            <button
              data-i18n-attr="aria-label:bar.repEnd"
              type="button"
              class="mus"
              data-g="re"
              aria-label="Fin de reprise"
            >
              &#x1D107;
            </button>
            <button
              data-i18n-attr="aria-label:bar.double"
              type="button"
              class="mus"
              data-g="dbl"
              aria-label="Double barre"
            >
              &#x1D101;
            </button>
            <button
              data-i18n-attr="aria-label:bar.final"
              type="button"
              class="mus"
              data-g="fin"
              aria-label="Barre de fin"
            >
              &#x1D102;
            </button>
          </div>
          <div class="pal-row g-row">
            <button
              data-i18n-attr="aria-label:grid.simile"
              type="button"
              class="mus"
              data-g="sim"
              aria-label="Répéter la mesure précédente"
            >
              &#x1D10E;
            </button>
            <button data-i18n="grid.insert" type="button" data-g="ins">+ Mes.</button>
            <button data-i18n="grid.delete" type="button" data-g="del">Suppr.</button>
            <button
              data-i18n-attr="aria-label:common.undo"
              type="button"
              data-g="undo"
              aria-label="Annuler"
              style="font-size: 20px"
            >
              &#8630;
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
