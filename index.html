<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Carnet de portées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Noto+Music&display=swap">
<style>
/* Layout: one narrow column of note "pages"; staff blocks sit between text blocks; a fixed input palette docks at the bottom while a staff is active. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#151A25; --muted:#5B6477; --line:#8D96A9; --rule:#DCE1EA;
  --accent:#2B47C9; --accent-soft:#E3E8FB; --sel:#D58300; --danger:#C2362B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-music:"Noto Music", "Noto Sans Symbols 2", "Segoe UI Symbol", serif;
  --pal-h:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1218; --surface:#171B24; --ink:#E7EAF1; --muted:#9AA3B5; --line:#6E778A; --rule:#2A303C;
  --accent:#93A6FF; --accent-soft:#222A48; --sel:#FFB52E; --danger:#FF7466; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#171B24; --ink:#E7EAF1; --muted:#9AA3B5; --line:#6E778A; --rule:#2A303C;
  --accent:#93A6FF; --accent-soft:#222A48; --sel:#FFB52E; --danger:#FF7466; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(32px + var(--pal-h))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;min-height:52px}
.top .grow{flex:1;min-width:0}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.1;margin:0}
.status{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.confirm{background:var(--danger);border-color:var(--danger);color:var(--surface)}

/* list */
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;overflow:hidden}
.card h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px;text-wrap:balance}
.card .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;margin-top:2px}
.card .snip{color:var(--muted);margin:6px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .thumb{margin-top:6px;pointer-events:none}
.empty{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-top:6px}
.empty h2{font-family:var(--f-display);font-size:20px;margin:0 0 4px}
.empty p{margin:0 0 10px;color:var(--muted);max-width:60ch}
.empty .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.backup{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule)}
.backup p{margin:4px 0 10px;color:var(--muted);max-width:60ch}
.backup .actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* note */
[hidden]{display:none!important}
.title-in{width:100%;border:0;resize:none;overflow:hidden;background:transparent;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;padding:4px 0 10px;outline:none}
.title-in::placeholder{color:var(--line)}
.blocks{display:flex;flex-direction:column;gap:10px}
.block{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-width:0}
.block.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.block.text{background:transparent;border-color:transparent;padding:2px 2px}
.block.text.active{background:var(--surface);border-color:var(--rule);box-shadow:none}
.block textarea{width:100%;border:0;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.5;padding:4px 2px;display:block;min-height:1.5em;overflow:hidden}
.block textarea::placeholder{color:var(--line)}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.shead .kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:2px}
.shead select,.shead input{border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:4px 6px;min-height:32px;font-size:14px}
.shead input[type=number]{width:62px}
.shead .tempo{display:inline-flex;align-items:center;gap:3px;font-size:14px}
.shead .tempo .mus{font-family:var(--f-music);font-size:18px}
.chip{border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:4px 10px;min-height:32px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.playbtn{margin-left:auto;border:0;background:var(--accent);color:var(--surface);border-radius:999px;min-height:34px;padding:0 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.playbtn.on{background:var(--ink)}
.staff-wrap{overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.staff-wrap svg{display:block}
.tools{display:none;gap:6px;justify-content:flex-end;margin-top:6px}
.block.active .tools{display:flex}
.tools button{border:1px solid var(--rule);background:var(--bg);border-radius:6px;min-height:32px;min-width:38px;padding:0 10px;font-size:13px}
.tools .confirm{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addbar .btn{flex:1;justify-content:center;min-width:96px}
.notefoot{margin-top:24px;display:flex;justify-content:center}

/* staff svg classes */
svg .l{stroke:var(--line);stroke-width:1}
svg .bar{stroke:var(--ink);stroke-width:1.2}
svg .f{fill:var(--ink)}
svg .s{stroke:var(--ink);fill:none}
svg .h{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
svg .t{fill:var(--ink);font-family:var(--f-display);font-weight:700}
svg .clef{fill:var(--ink);font-family:var(--f-music)}
svg .chord{fill:var(--ink);font-family:var(--f-body);font-weight:600;font-size:14px}
svg .mnum{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
svg .cursor{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
svg .cursorbg{fill:var(--accent-soft)}
svg .it.sel .f,svg .it.sel .chord{fill:var(--sel)}
svg .it.sel .s{stroke:var(--sel)}
svg .it.sel .h{stroke:var(--sel)}
svg .it.play .f,svg .it.play .chord{fill:var(--accent)}
svg .it.play .s,svg .it.play .h{stroke:var(--accent)}
svg .selbg{fill:var(--sel);opacity:.14}

/* palette */
#palette{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(10,15,30,.12);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.pal-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-top:8px}
.pal-info{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-height:32px}
.pal-info span{flex:1;min-width:0}
.pal-info button{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;border-radius:999px;padding:0 14px;min-height:32px}
.pal-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.pal-row button{min-height:46px;border:1px solid var(--rule);background:var(--bg);border-radius:8px;font-size:15px;padding:0;display:flex;align-items:center;justify-content:center;min-width:0}
.pal-row button.mus{font-family:var(--f-music);font-size:26px;line-height:1}
.pal-row button.accb{font-size:22px}
.pal-row button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pal-row .sep{border-left:2px solid var(--rule)}
.pal-chord{display:flex;gap:6px}
.pal-chord input{flex:1;min-width:0;border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font-size:16px;background:var(--bg)}
.pal-chord button{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:0 12px}
.pal-chord button.ok{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
@media (prefers-reduced-motion:no-preference){.block{transition:border-color .15s,box-shadow .15s}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<div id="palette" hidden>
  <div class="pal-inner">
    <div class="pal-info"><span id="palInfo"></span><button id="palDone" type="button">Terminé</button></div>
    <div class="pal-chord" id="chordBar" hidden>
      <input id="chordIn" placeholder="Accord, ex. Bb7, Cm7, F7alt" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="chordOk" class="ok" type="button">OK</button>
      <button id="chordCancel" type="button">Annuler</button>
    </div>
    <div class="pal-row" id="rowDur">
      <button type="button" class="mus" data-dur="w" aria-label="Ronde">&#x1D15D;</button>
      <button type="button" class="mus" data-dur="h" aria-label="Blanche">&#x1D15E;</button>
      <button type="button" class="mus" data-dur="q" aria-label="Noire">&#x1D15F;</button>
      <button type="button" class="mus" data-dur="8" aria-label="Croche">&#x1D160;</button>
      <button type="button" class="mus" data-dur="16" aria-label="Double croche">&#x1D161;</button>
      <button type="button" data-act="dot" aria-label="Note pointée" style="font-size:26px;font-weight:700">&middot;</button>
      <button type="button" class="mus" data-act="rest" aria-label="Silence">&#x1D13D;</button>
    </div>
    <div class="pal-row" id="rowMod">
      <button type="button" class="accb" data-acc="-1" aria-label="Bémol">&#x266D;</button>
      <button type="button" class="accb" data-acc="0" aria-label="Bécarre">&#x266E;</button>
      <button type="button" class="accb" data-acc="1" aria-label="Dièse">&#x266F;</button>
      <button type="button" data-act="chord" aria-label="Accord" style="font-weight:600;font-size:13px">Acc.</button>
      <button type="button" data-act="prev" aria-label="Note précédente">&#9664;</button>
      <button type="button" data-act="next" aria-label="Note suivante">&#9654;</button>
      <button type="button" data-act="undo" aria-label="Annuler" style="font-size:20px">&#8630;</button>
      <button type="button" data-act="del" aria-label="Effacer" style="font-size:20px">&#9003;</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const DUR={w:4,h:2,q:1,'8':.5,'16':.25};
const BASEW={w:46,h:34,q:27,'8':23,'16':21};
const H=5; // half space
const NAMES=['Do','Ré','Mi','Fa','Sol','La','Si'];
const SEMI=[0,2,4,5,7,9,11];
const CLEFBASE={treble:{L:2,O:4},bass:{L:4,O:2}};
const LS='carnet-portees-v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const qlen=it=>DUR[it.d]*(it.dot?1.5:1);
const mlen=t=>{const [n,d]=t.split('/').map(Number);return n*4/d;};
const beatUnit=t=>t.endsWith('/8')?1.5:1;
const mod=(a,n)=>((a%n)+n)%n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtChord=c=>c.replace(/([A-G])b/g,'$1♭').replace(/#/g,'♯');

/* ---------- state ---------- */
let notes={};
let view={name:'list',id:null};
let activeId=null, sel=null, playIdx=null;
const input={d:'q',dot:false,rest:false,acc:null};
const hist={};
let syncMode='local', col=null, syncErr=false;

/* ---------- storage ---------- */
function lsRead(){try{return JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){return {}}}
let lsTimer=null;
function lsWrite(){clearTimeout(lsTimer);lsTimer=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(notes))}catch(e){}},150);}
const pack=n=>({title:n.title||'',updated:n.updated||0,body:JSON.stringify(n.blocks||[])});
function unpack(id,d){try{return {id,title:d.title||'',updated:d.updated||0,blocks:JSON.parse(d.body||'[]')}}catch(e){return null}}
const chains={},rTimers={};
function pushRemote(n){
  if(!col)return;
  const id=n.id;
  chains[id]=(chains[id]||Promise.resolve()).then(()=>{const cur=notes[id];if(!cur)return;return col.doc(id).set(pack(cur));}).then(()=>{if(syncErr){syncErr=false;updateStatus();}}).catch(()=>{syncErr=true;updateStatus();});
}
function save(n){
  n.updated=Date.now(); lsWrite();
  if(col){clearTimeout(rTimers[n.id]);rTimers[n.id]=setTimeout(()=>pushRemote(n),700);}
}
function removeNote(id){
  delete notes[id]; lsWrite();
  if(col){clearTimeout(rTimers[id]);chains[id]=(chains[id]||Promise.resolve()).then(()=>col.doc(id).delete()).catch(()=>{});}
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const c=db.collection('data/users/'+id+'/notes');
    const snap=await Promise.race([c.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    col=c;
    const remote={};
    snap.docs.forEach(d=>{if(d.exists){const n=unpack(d.id,d.data());if(n)remote[d.id]=n;}});
    Object.values(notes).forEach(n=>{const r=remote[n.id];if(!r||n.updated>r.updated)pushRemote(n);});
    let changed=false;
    Object.values(remote).forEach(r=>{const l=notes[r.id];if(!l||r.updated>l.updated){if(view.name==='note'&&view.id===r.id)return;notes[r.id]=r;changed=true;}});
    syncMode='db'; lsWrite();
    if(changed&&view.name==='list')render(); else updateStatus();
  }catch(e){col=null;syncMode='local';updateStatus();}
}
function statusText(){
    return 'Enregistré sur ce téléphone';
}
function updateStatus(){document.querySelectorAll('[data-status]').forEach(el=>el.textContent=statusText());}

/* ---------- history ---------- */
function pushHist(n){const h=hist[n.id]||(hist[n.id]=[]);h.push(JSON.stringify({t:n.title,b:n.blocks}));if(h.length>80)h.shift();}
function undo(){
  const n=notes[view.id];if(!n)return;const h=hist[n.id];if(!h||!h.length)return;
  const s=JSON.parse(h.pop());n.title=s.t;n.blocks=s.b;sel=null;
  if(activeId&&!n.blocks.some(b=>b.id===activeId))activeId=null;
  save(n);renderNote(true);
}

/* ---------- music helpers ---------- */
function midiOf(clef,s,acc){const b=CLEFBASE[clef]||CLEFBASE.treble;const t=b.L+s;return 12*(b.O+Math.floor(t/7)+1)+SEMI[mod(t,7)]+acc;}
function midis(b){
  const ML=mlen(b.time);let pos=0,carry={};
  return b.items.map(it=>{let m=null;
    if(!it.r&&b.clef!=='rhythm'){if(it.a!=null)carry[it.s]=it.a;m=midiOf(b.clef,it.s,carry[it.s]??0);}
    pos+=qlen(it);if(pos>=ML-1e-6){pos=0;carry={};}return m;});
}
function pitchName(clef,s,a){const b=CLEFBASE[clef]||CLEFBASE.treble;const t=b.L+s;const acc=a==null?'':a===-1?'♭':a===1?'♯':'♮';return NAMES[mod(t,7)]+acc+' '+(b.O+Math.floor(t/7));}

/* ---------- layout ---------- */
function layout(b,W){
  const rh=b.clef==='rhythm',items=b.items,ML=mlen(b.time);
  const widths=items.map(it=>{let w=BASEW[it.d];if(it.dot)w+=7;if(it.a!=null&&!it.r&&!rh)w+=12;if(it.c)w=Math.max(w,it.c.length*8+10);return w;});
  const measures=[];let cur=[],pos=0;
  items.forEach((it,i)=>{cur.push(i);pos+=qlen(it);if(pos>=ML-1e-6){measures.push({idx:cur,full:true});cur=[];pos=0;}});
  if(cur.length)measures.push({idx:cur,full:false});
  const firstStart=rh?46:64,otherStart=rh?30:44,PADL=10,PADR=8;
  const systems=[];let sys;
  const newSys=()=>{sys={start:systems.length?otherStart:firstStart,ms:[],used:0,end:0};systems.push(sys);};
  newSys();
  measures.forEach(m=>{const w=PADL+m.idx.reduce((s,i)=>s+widths[i],0)+PADR;const avail=W-sys.start-4;if(sys.ms.length&&sys.used+w>avail)newSys();sys.ms.push({m,w});sys.used+=w;});
  const pos2=[],bars=[];let mcount=0;
  systems.forEach((s,si)=>{
    const avail=W-s.start-4,last=si===systems.length-1;
    let sc=1;if(s.used>avail)sc=avail/s.used;else if(!last&&s.used>0)sc=Math.min(avail/s.used,2.4);
    s.firstMeasure=mcount+1;let x=s.start;
    s.ms.forEach(({m})=>{mcount++;x+=PADL*sc;
      m.idx.forEach(i=>{const it=items[i];const iw=widths[i]*sc;const off=(it.a!=null&&!it.r&&!rh?12:0)+8;pos2[i]={sys:si,x:x+off*Math.min(1,sc),x0:x,x1:x+iw};x+=iw;});
      x+=PADR*sc;if(m.full)bars.push({sys:si,x});});
    s.end=x;
  });
  let ls=systems[systems.length-1];
  if(W-ls.end<48){newSys();sys.end=sys.start;sys.firstMeasure=mcount+1;ls=sys;}
  const appendSys=systems.length-1,appendX=ls.ms.length?ls.end+8:ls.start+6;
  const SH=rh?92:124;
  systems.forEach((s,si)=>{s.top=si*SH;});
  return {rh,systems,pos:pos2,bars,appendSys,appendX,SH,height:systems.length*SH,ML};
}
function geom(L,si){
  const top=si*L.SH;
  if(L.rh){const ly=top+56;return {top,chordY:top+20,staffTop:ly,staffBottom:ly,mid:ly,line:ly};}
  const st=top+46;return {top,chordY:top+20,staffTop:st,staffBottom:st+40,mid:st+20};
}

/* ---------- drawing ---------- */
function restSvg(d,x,g,rh){
  const m=g.mid;
  if(d==='w'){const y=rh?m:g.staffTop+10;return `<rect class="f" x="${x-6}" y="${y}" width="12" height="5"/>`;}
  if(d==='h')return `<rect class="f" x="${x-6}" y="${m-5}" width="12" height="5"/>`;
  if(d==='q')return `<path class="s" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" d="M${x-2} ${m-15} L${x+4} ${m-8} L${x-1} ${m-2} L${x+4} ${m+4} C${x-2} ${m+1} ${x-4} ${m+8} ${x+1} ${m+12}"/>`;
  let s=`<circle class="f" cx="${x-3}" cy="${m-5}" r="2.6"/><path class="s" stroke-width="1.6" stroke-linecap="round" d="M${x-3} ${m-3} Q${x+1} ${m-2} ${x+4} ${m-7} L${x-1} ${m+(d==='16'?14:10)}"/>`;
  if(d==='16')s+=`<circle class="f" cx="${x-5}" cy="${m+2}" r="2.6"/><path class="s" stroke-width="1.6" stroke-linecap="round" d="M${x-5} ${m+4} Q${x-1} ${m+5} ${x+2} ${m+1}"/>`;
  return s;
}
function accSvg(a,x,y){

function staffSvg(b,W,opt){

  const height=sysCount*L.SH;

  // staff lines, clef, time
  for(let si=0;si<sysCount;si++){
    const g=geom(L,si),s=L.systems[si];
    if(L.rh){out+=`<line class="l" x1="0" x2="${W}" y1="${g.line}" y2="${g.line}"/>`;
      out+=`<rect class="f" x="9" y="${g.line-10}" width="3.2" height="20"/><rect class="f" x="15" y="${g.line-10}" width="3.2" height="20"/>`;
    }else{
      for(let k=0;k<5;k++){const y=g.staffTop+k*10;out+=`<line class="l" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;}
      out+=`<line class="bar" x1="0.6" x2="0.6" y1="${g.staffTop}" y2="${g.staffBottom}"/>`;
      if(b.clef==='bass')out+=`<text class="clef" x="4" y="${g.staffTop+30}" font-size="38">\u{1D122}</text>`;
      else out+=`<text class="clef" x="3" y="${g.staffTop+30}" font-size="38">\u{1D11E}</text>`;
    }
    if(si===0){const [n,d]=b.time.split('/');
      if(L.rh){out+=`<text class="t" x="34" y="${g.line-3}" font-size="15" text-anchor="middle">${n}</text><text class="t" x="34" y="${g.line+14}" font-size="15" text-anchor="middle">${d}</text>`;}
      else{out+=`<text class="t" x="46" y="${g.staffTop+17}" font-size="21" text-anchor="middle">${n}</text><text class="t" x="46" y="${g.staffTop+37}" font-size="21" text-anchor="middle">${d}</text>`;}
    }else if(s.ms.length){out+=`<text class="mnum" x="2" y="${(L.rh?g.line-16:g.staffTop-8)}">${s.firstMeasure}</text>`;}
  }
  // barlines
  L.bars.forEach(br=>{if(br.sys>=sysCount)return;const g=geom(L,br.sys);out+=`<line class="bar" x1="${br.x}" x2="${br.x}" y1="${L.rh?g.line-10:g.staffTop}" y2="${L.rh?g.line+10:g.staffBottom}"/>`;});
  // beams
  const stemInfo={};let beamOut='';
  const BU=beatUnit(b.time);
  const groups=[];{let pos=0,cur=[],curBeat=-1,curSys=-1;
    const flush=()=>{if(cur.length>=2)groups.push(cur);cur=[];};
    items.forEach((it,i)=>{const beat=Math.floor(pos/BU+1e-6);const p=L.pos[i];
      if(!it.r&&(it.d==='8'||it.d==='16')){if(beat!==curBeat||p.sys!==curSys)flush();cur.push(i);curBeat=beat;curSys=p.sys;}else{flush();curBeat=-1;}
      pos+=qlen(it);if(pos>=L.ML-1e-6){pos=0;flush();curBeat=-1;}});
    flush();}
  const yOf=(g,s)=>L.rh?g.line:g.staffBottom-s*H;
  groups.forEach(gr=>{
    const si=L.pos[gr[0]].sys;if(si>=sysCount)return;const g=geom(L,si);
    const avg=gr.reduce((a,i)=>a+(L.rh?0:items[i].s),0)/gr.length;
    const up=L.rh||avg<4;
    const pts=gr.map(i=>{const y=yOf(g,L.rh?4:items[i].s);const sx=L.pos[i].x+(up?5.6:-5.6);return {i,y,sx};});
    const f=pts[0],l=pts[pts.length-1];
    const e0=up?f.y-32:f.y+32,e1=up?l.y-32:l.y+32;
    let slope=l.sx>f.sx?(e1-e0)/(l.sx-f.sx):0;slope=Math.max(-.22,Math.min(.22,slope));
    let bAt=x=>e0+slope*(x-f.sx);
    let shift=0;pts.forEach(p=>{const v=up?bAt(p.sx)-(p.y-27):(p.y+27)-bAt(p.sx);if(v>shift)shift=v;});
    const base=bAt;bAt=x=>base(x)+(up?-shift:shift);
    const T=4.6,dir=up?1:-1;
    const poly=(x1,x2,o)=>{const a=bAt(x1)+o*dir,c=bAt(x2)+o*dir;return `<polygon class="f" points="${x1},${a} ${x2},${c} ${x2},${c+T*dir} ${x1},${a+T*dir}"/>`;};
    beamOut+=poly(f.sx-(up?0.8:0),l.sx+(up?0:0.8),0);
    // secondary
    for(let k=0;k<pts.length;k++){
      if(items[pts[k].i].d!=='16')continue;let j=k;while(j+1<pts.length&&items[pts[j+1].i].d==='16')j++;
      if(j>k)beamOut+=poly(pts[k].sx,pts[j].sx,7.4);
      else{const x=pts[k].sx;beamOut+=k===pts.length-1?poly(x-8,x,7.4):poly(x,x+8,7.4);}

    pts.forEach(p=>{stemInfo[p.i]={sx:p.sx,y1:p.y+(up?-1:1),y2:bAt(p.sx),beamed:true};});
  });
  // items
  items.forEach((it,i)=>{
    const p=L.pos[i];if(p.sys>=sysCount)return;const g=geom(L,p.sys);
    const cls='it'+(opt.sel===i?' sel':'')+(opt.play===i?' play':'');
    let s=`<g class="${cls}">`;
    if(opt.sel===i){const top=L.rh?g.line-26:g.staffTop-14;s+=`<rect class="selbg" x="${p.x0}" y="${top}" width="${p.x1-p.x0}" height="${L.rh?52:68}" rx="4"/>`;}
    if(it.c)s+=`<text class="chord" x="${p.x-6}" y="${g.chordY}">${esc(fmtChord(it.c))}</text>`;
    if(it.r){s+=restSvg(it.d,p.x,g,L.rh);if(it.dot)s+=`<circle class="f" cx="${p.x+10}" cy="${g.mid-(L.rh?5:5)}" r="1.9"/>`;}
    else{
      const st=L.rh?4:it.s,y=yOf(g,st);
      if(!L.rh){for(let k=-2;k>=st;k-=2){const ly=yOf(g,k);s+=`<line class="s" stroke-width="1.2" x1="${p.x-10}" x2="${p.x+10}" y1="${ly}" y2="${ly}"/>`;}
        for(let k=10;k<=st;k+=2){const ly=yOf(g,k);s+=`<line class="s" stroke-width="1.2" x1="${p.x-10}" x2="${p.x+10}" y1="${ly}" y2="${ly}"/>`;}}
      const hollow=it.d==='w'||it.d==='h';
      const rx=it.d==='w'?7.6:6.2,ry=it.d==='w'?4.8:4.5;
      s+=`<ellipse class="${hollow?'h':'f'}" cx="${p.x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${it.d==='w'?-8:-22} ${p.x} ${y})"${hollow?' stroke-width="'+(it.d==='w'?2.4:1.8)+'"':''}/>`;
      if(it.a!=null&&!L.rh)s+=accSvg(it.a,p.x-15,y);
      if(it.dot){const dy=(L.rh||mod(st,2)===0)?y-H:y;s+=`<circle class="f" cx="${p.x+(it.d==='w'?13:11)}" cy="${dy}" r="1.9"/>`;}
      if(it.d!=='w'){
        const si2=stemInfo[i];
        if(si2)s+=`<line class="s" stroke-width="1.3" x1="${si2.sx}" x2="${si2.sx}" y1="${si2.y1}" y2="${si2.y2}"/>`;
        else{const up=L.rh||st<4;const sx=p.x+(up?5.6:-5.6);let ey=up?y-34:y+34;
          if(!L.rh){if(up&&ey>g.mid)ey=g.mid;if(!up&&ey<g.mid)ey=g.mid;}
          s+=`<line class="s" stroke-width="1.3" x1="${sx}" x2="${sx}" y1="${y+(up?-1:1)}" y2="${ey}"/>`;
          const nf=it.d==='8'?1:it.d==='16'?2:0;
          for(let k=0;k<nf;k++){const o=k*7;
            s+=up?`<path class="s" stroke-width="2" stroke-linecap="round" d="M${sx} ${ey+o} C${sx} ${ey+o+7} ${sx+9} ${ey+o+11} ${sx+7} ${ey+o+22}"/>`
                 :`<path class="s" stroke-width="2" stroke-linecap="round" d="M${sx} ${ey-o} C${sx} ${ey-o-7} ${sx+9} ${ey-o-11} ${sx+7} ${ey-o-22}"/>`;}
        }

    out+=`<line class="cursor" x1="${L.appendX}" x2="${L.appendX}" y1="${y1}" y2="${y2}"/>`;}
  out+='</svg>';
  return {svg:out,L};
}

/* ---------- audio ---------- */
let ac=null;
function actx(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();}if(ac.state==='suspended')ac.resume();return ac;}
function tone(t,dur,midi,nodes){
  const c=actx();if(!c||midi==null)return;const f=440*Math.pow(2,(midi-69)/12);
  const o1=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain(),g1=c.createGain();
  o1.type='sawtooth';o2.type='triangle';o1.frequency.value=f;o2.frequency.value=f;g1.gain.value=.35;
  lp.type='lowpass';lp.Q.value=.8;lp.frequency.setValueAtTime(f*1.5,t);lp.frequency.linearRampToValueAtTime(f*4,t+.05);lp.frequency.setTargetAtTime(f*2.2,t+.06,.15);
  const v=.16,end=t+Math.max(.06,dur*.94);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.025);g.gain.setTargetAtTime(v*.75,t+.04,.12);g.gain.setTargetAtTime(0,end,.025);
  o1.connect(g1);g1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(c.destination);
  o1.start(t);o2.start(t);o1.stop(end+.2);o2.stop(end+.2);if(nodes)nodes.push(o1,o2);
}
function perc(t,accent,nodes){
  const c=actx();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(accent?1250:950,t);o.frequency.exponentialRampToValueAtTime(accent?700:520,t+.06);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(accent?.5:.35,t+.003);g.gain.exponentialRampToValueAtTime(.001,t+.11);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.13);if(nodes)nodes.push(o);
}
function preview(b,i){
  const it=b.items[i];if(!it||it.r)return;const c=actx();if(!c)return;
  if(b.clef==='rhythm')perc(c.currentTime+.01,false);else tone(c.currentTime+.01,.38,midis(b)[i]);
}
let playing=null;
function stopPlay(){
  if(!playing)return;playing.timers.forEach(clearTimeout);playing.nodes.forEach(n=>{try{n.stop()}catch(e){}});
  const id=playing.id;playing=null;playIdx=null;redrawStaff(id);updatePlayBtn(id);
}
function play(b){
  const was=playing&&playing.id===b.id;stopPlay();if(was)return;
  const c=actx();if(!c||!b.items.length)return;
  const spq=60/(b.tempo||120),sw=b.swing&&!b.time.endsWith('/8');
  const warp=q=>{const f=Math.floor(q+1e-9),r=q-f;return f+(r<.5?r*4/3:2/3+(r-.5)*2/3);};
  const mids=midis(b),ML=mlen(b.time),BU=beatUnit(b.time);
  playing={id:b.id,timers:[],nodes:[]};
  const t0=c.currentTime+.12;let q=0,mpos=0;
  b.items.forEach((it,i)=>{
    const Lq=qlen(it),a=sw?warp(q):q,e=sw?warp(q+Lq):q+Lq,ts=t0+a*spq,te=t0+e*spq;
    if(!it.r){if(b.clef==='rhythm')perc(ts,Math.abs(mpos/BU-Math.round(mpos/BU))<1e-6&&mpos<1e-6,playing.nodes);else tone(ts,te-ts,mids[i],playing.nodes);}
    playing.timers.push(setTimeout(()=>{playIdx=i;redrawStaff(b.id);},Math.max(0,(ts-c.currentTime)*1000)));
    q+=Lq;mpos+=Lq;if(mpos>=ML-1e-6)mpos=0;
  });
  const endT=t0+(sw?warp(q):q)*spq;
  playing.timers.push(setTimeout(stopPlay,Math.max(0,(endT-c.currentTime)*1000+150)));
  updatePlayBtn(b.id);
}
function updatePlayBtn(id){const btn=document.querySelector(`[data-play="${id}"]`);if(!btn)return;const on=playing&&playing.id===id;btn.classList.toggle('on',!!on);btn.innerHTML=on?'&#9632; Stop':'&#9654; Écouter';}

/* ---------- views ---------- */
const app=document.getElementById('app');
function render(){if(view.name==='note'&&notes[view.id])renderNote();else{view={name:'list',id:null};renderList();}}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}catch(e){return ''}}
function noteSummary(n){const st=n.blocks.filter(b=>b.type==='staff');const r=st.filter(b=>b.clef==='rhythm').length,p=st.length-r;const parts=[];if(p)parts.push(p+(p>1?' portées':' portée'));if(r)parts.push(r+(r>1?' rythmes':' rythme'));return parts.join(' · ');}

function renderList(){
  stopPlay();activeId=null;sel=null;showPalette(false);
  const list=Object.values(notes).sort((a,b)=>b.updated-a.updated);
  app.innerHTML=`<header class="top"><div class="grow"><h1 class="brand">Carnet de portées</h1><div class="status" data-status>${statusText()}</div></div><button class="btn primary" id="newNote" type="button">+ Note</button></header>
  <div id="listBody"></div>`;
  const body=app.querySelector('#listBody');
  if(!list.length){
    const ex=exampleNote();const st=ex.blocks[1];
    body.innerHTML=`<div class="empty"><div class="eyebrow">Aperçu</div><h2>Notez une idée en trois touchers</h2><p>Écrivez du texte, insérez une portée ou une ligne rythmique, puis touchez la portée pour poser les notes. Accords chiffrés et lecture audio inclus.</p><div class="thumb" id="emptyThumb"></div><div class="actions"><button class="btn primary" id="newNote2" type="button">Nouvelle note</button><button class="btn" id="tryEx" type="button">Ouvrir l'exemple</button></div></div>`;
    requestAnimationFrame(()=>{const el=body.querySelector('#emptyThumb');if(el)el.innerHTML=staffSvg(st,el.clientWidth||320).svg;});
    body.querySelector('#newNote2').onclick=newNote;
    body.querySelector('#tryEx').onclick=()=>{const n=exampleNote();notes[n.id]=n;save(n);openNote(n.id);};
  }else{
    const wrap=document.createElement('div');wrap.className='list';
    list.forEach(n=>{
      const btn=document.createElement('button');btn.type='button';btn.className='card';
      const txt=(n.blocks.find(b=>b.type==='text'&&b.text.trim())||{}).text||'';
      const sum=noteSummary(n);
      btn.innerHTML=`<h3>${esc(n.title||'Sans titre')}</h3><div class="meta"><span>${fmtDate(n.updated)}</span>${sum?`<span>${sum}</span>`:''}</div>${txt?`<p class="snip">${esc(txt.split('\n')[0])}</p>`:''}<div class="thumb"></div>`;
      btn.onclick=()=>openNote(n.id);
      wrap.appendChild(btn);
    });
    body.appendChild(wrap);
    requestAnimationFrame(()=>{wrap.querySelectorAll('.card').forEach((c,k)=>{const n=list[k];const st=n.blocks.find(b=>b.type==='staff'&&b.items.length);const th=c.querySelector('.thumb');if(st&&th)th.innerHTML=staffSvg(st,th.clientWidth||300,{maxSystems:1}).svg;});});
  }
  const bk=document.createElement('div');bk.className='backup';
  bk.innerHTML=`<div class="eyebrow">Sauvegarde</div><p>Tes notes restent sur ce téléphone. Exporte un fichier de temps en temps pour ne rien perdre.</p><div class="actions"><button class="btn" id="exp" type="button">Exporter</button><label class="btn" for="impIn">Importer</label><input type="file" id="impIn" accept="application/json,.json" hidden></div><div class="status" id="bkMsg"></div>`;
  body.appendChild(bk);
  bk.querySelector('#exp').onclick=()=>{const blob=new Blob([JSON.stringify({app:'carnet-portees',version:1,exported:Date.now(),notes},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carnet-portees-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);bk.querySelector('#bkMsg').textContent='Fichier exporté dans tes téléchargements.';};
  bk.querySelector('#impIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const ns=d.notes||d;let k=0;Object.values(ns).forEach(n=>{if(n&&n.id&&Array.isArray(n.blocks)){const cur=notes[n.id];if(!cur||n.updated>=cur.updated){notes[n.id]=n;k++;}}});lsWrite();renderList();const m=app.querySelector('#bkMsg');if(m)m.textContent=k+(k>1?' notes importées.':' note importée.');}catch(err){bk.querySelector('#bkMsg').textContent="Ce fichier n'est pas une sauvegarde du carnet.";}};r.readAsText(f);};
  app.querySelector('#newNote').onclick=newNote;
}
function newNote(){const n={id:uid(),title:'',updated:Date.now(),blocks:[{id:uid(),type:'text',text:''}]};notes[n.id]=n;save(n);openNote(n.id,true);}
function openNote(id,focusTitle){view={name:'note',id};activeId=null;sel=null;renderNote();window.scrollTo(0,0);if(focusTitle){const t=app.querySelector('.title-in');if(t)t.focus();}}

function exampleNote(){return {id:uid(),title:'Exemple · motif sur Bb blues',updated:Date.now(),blocks:[
  {id:uid(),type:'text',text:'Motif de deux mesures, à développer en question / réponse. Essayer plus lent.'},
  {id:uid(),type:'staff',clef:'treble',time:'4/4',tempo:132,swing:true,items:[
    {d:'8',s:4,a:-1,c:'Bb7'},{d:'8',s:6},{d:'8',s:8},{d:'8',s:10,a:-1},{d:'q',s:9},{d:'8',s:8},{d:'8',s:6},
    {d:'q',dot:true,s:6,a:-1,c:'Eb7'},{d:'8',s:5},{d:'q',s:4,a:-1},{d:'q',r:true},
    {d:'h',s:1,c:'Bb7'},{d:'h',r:true}]},
  {id:uid(),type:'text',text:'Cellule rythmique pour la relance :'},
  {id:uid(),type:'staff',clef:'rhythm',time:'4/4',tempo:132,swing:true,items:[{d:'8'},{d:'8'},{d:'q'},{d:'8',dot:true},{d:'16'},{d:'8',r:true},{d:'8'}]}
]};}

let delArm=null;
function renderNote(keepScroll){
  const n=notes[view.id];if(!n){view={name:'list'};renderList();return;}
  const sy=window.scrollY;
  app.innerHTML=`<header class="top"><button class="btn ghost" id="back" type="button">&#8249; Notes</button><div class="grow"></div><span class="status" data-status>${statusText()}</span></header>
  <textarea class="title-in" id="titleIn" rows="1" placeholder="Titre de la note"></textarea>
  <div class="blocks" id="blocks"></div>
  <div class="addbar"><button class="btn" data-add="text" type="button">+ Texte</button><button class="btn" data-add="staff" type="button">+ Portée</button><button class="btn" data-add="rhythm" type="button">+ Rythme</button></div>
  <div class="notefoot"><button class="btn ghost danger" id="delNote" type="button">Supprimer la note</button></div>`;
  const ti=app.querySelector('#titleIn');ti.value=n.title;autosize(ti);
  ti.addEventListener('focus',()=>{pushHist(n);setActive(null);});
  ti.addEventListener('input',()=>{n.title=ti.value.replace(/\n/g,' ');autosize(ti);save(n);});
  ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ti.blur();}});
  app.querySelector('#back').onclick=()=>{view={name:'list'};renderList();window.scrollTo(0,0);};
  const dn=app.querySelector('#delNote');
  dn.onclick=()=>{if(dn.dataset.armed){removeNote(n.id);view={name:'list'};renderList();return;}dn.dataset.armed='1';dn.textContent='Toucher encore pour supprimer';dn.classList.add('confirm');setTimeout(()=>{if(dn.isConnected){delete dn.dataset.armed;dn.textContent='Supprimer la note';dn.classList.remove('confirm');}},3500);};
  app.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>addBlock(n,btn.dataset.add));
  const bl=app.querySelector('#blocks');
  n.blocks.forEach((b,bi)=>bl.appendChild(blockEl(n,b,bi)));
  requestAnimationFrame(()=>{n.blocks.forEach(b=>{if(b.type==='staff')redrawStaff(b.id);});app.querySelectorAll('.block textarea').forEach(autosize);});
  updateActive();
  if(keepScroll)window.scrollTo(0,sy);
}
function autosize(t){t.style.height='auto';t.style.height=t.scrollHeight+'px';}
function addBlock(n,kind){
  pushHist(n);
  const b=kind==='text'?{id:uid(),type:'text',text:''}:{id:uid(),type:'staff',clef:kind==='rhythm'?'rhythm':'treble',time:'4/4',tempo:100,swing:false,items:[]};
  n.blocks.push(b);save(n);activeId=b.id;sel=null;renderNote(true);
  const el=app.querySelector(`[data-block="${b.id}"]`);
  if(el){el.scrollIntoView({block:'center',behavior:'smooth'});if(kind==='text'){const t=el.querySelector('textarea');t&&t.focus();}}
}
function toolsHtml(){return `<div class="tools"><button type="button" data-tool="up" aria-label="Monter">&#8593;</button><button type="button" data-tool="down" aria-label="Descendre">&#8595;</button><button type="button" data-tool="del">Supprimer</button></div>`;}
function blockEl(n,b,bi){
  const el=document.createElement('div');el.className='block '+(b.type==='text'?'text':'staff');el.dataset.block=b.id;
  if(b.type==='text'){
    el.innerHTML=`<textarea rows="1" placeholder="${bi===0?'Écrivez ici…':'Texte'}" id="t_${b.id}"></textarea>`+toolsHtml();
    const t=el.querySelector('textarea');t.value=b.text;
    t.addEventListener('focus',()=>{pushHist(n);setActive(b.id);});
    t.addEventListener('input',()=>{b.text=t.value;autosize(t);save(n);});
  }else{
    const rh=b.clef==='rhythm';
    el.innerHTML=`<div class="shead"><span class="kind">${rh?'Rythme':'Portée'}</span>
      ${rh?'':`<select data-f="clef" id="c_${b.id}" aria-label="Clé"><option value="treble">Sol</option><option value="bass">Fa</option></select>`}
      <select data-f="time" id="m_${b.id}" aria-label="Mesure">${['4/4','3/4','2/4','5/4','6/8','12/8'].map(t=>`<option>${t}</option>`).join('')}</select>
      <label class="tempo"><span class="mus">&#x1D15F;</span>=<input type="number" inputmode="numeric" min="30" max="300" data-f="tempo" id="tp_${b.id}"></label>
      <button type="button" class="chip" data-f="swing" aria-pressed="${!!b.swing}">Swing</button>
      <button type="button" class="playbtn" data-play="${b.id}">&#9654; Écouter</button></div>
      <div class="staff-wrap" data-staff="${b.id}"></div>`+toolsHtml();
    const cs=el.querySelector('[data-f=clef]');if(cs){cs.value=b.clef;cs.onchange=()=>{pushHist(n);b.clef=cs.value;save(n);redrawStaff(b.id);updatePalette();};}
    const ms=el.querySelector('[data-f=time]');ms.value=b.time;ms.onchange=()=>{pushHist(n);b.time=ms.value;save(n);redrawStaff(b.id);};
    const tp=el.querySelector('[data-f=tempo]');tp.value=b.tempo;tp.onchange=()=>{const v=Math.max(30,Math.min(300,parseInt(tp.value,10)||100));tp.value=v;b.tempo=v;save(n);};
    const swb=el.querySelector('[data-f=swing]');swb.onclick=()=>{b.swing=!b.swing;swb.setAttribute('aria-pressed',b.swing);save(n);};
    el.querySelector('[data-play]').onclick=()=>{setActive(b.id);play(b);};
    el.querySelector('.staff-wrap').addEventListener('click',e=>staffTap(n,b,e));
  }
  el.querySelectorAll('[data-tool]').forEach(btn=>btn.onclick=()=>{
    const i=n.blocks.indexOf(b);const tool=btn.dataset.tool;
    if(tool==='del'){
      if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='Confirmer';btn.classList.add('confirm');setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent='Supprimer';btn.classList.remove('confirm');}},3000);return;}
      pushHist(n);if(playing&&playing.id===b.id)stopPlay();n.blocks.splice(i,1);activeId=null;sel=null;save(n);renderNote(true);return;}
    const j=tool==='up'?i-1:i+1;if(j<0||j>=n.blocks.length)return;
    pushHist(n);n.blocks.splice(i,1);n.blocks.splice(j,0,b);save(n);renderNote(true);
    const nel=app.querySelector(`[data-block="${b.id}"]`);nel&&nel.scrollIntoView({block:'nearest'});
  });
  return el;
}
function curNote(){return notes[view.id];}
function blockById(id){const n=curNote();return n?n.blocks.find(b=>b.id===id):null;}
function setActive(id){
  if(activeId===id)return;const prev=activeId;activeId=id;sel=null;
  if(prev)redrawStaff(prev);if(id)redrawStaff(id);updateActive();
}
function updateActive(){
  app.querySelectorAll('.block').forEach(el=>el.classList.toggle('active',el.dataset.block===activeId));
  const b=activeId&&blockById(activeId);showPalette(!!(b&&b.type==='staff'));
}
function redrawStaff(id){
  const b=blockById(id);if(!b||b.type!=='staff')return;
  const wrap=app.querySelector(`[data-staff="${id}"]`);if(!wrap)return;
  const W=Math.max(220,wrap.clientWidth||300);
  const isAct=activeId===id;
  wrap.innerHTML=staffSvg(b,W,{sel:isAct?sel:null,play:playing&&playing.id===id?playIdx:null,cursor:isAct}).svg;
  wrap._W=W;
  if(isAct)updatePalette();
}
function staffTap(n,b,e){
  const wrap=e.currentTarget;const r=wrap.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  const wasActive=activeId===b.id;
  if(!wasActive){const prev=activeId;activeId=b.id;sel=null;if(prev)redrawStaff(prev);updateActive();
    const ae=document.activeElement;if(ae&&ae.blur&&ae!==document.body)ae.blur();}
  const L=layout(b,wrap._W||wrap.clientWidth);
  const si=Math.max(0,Math.min(L.systems.length-1,Math.floor(y/L.SH)));
  const g=geom(L,si);
  const sFromY=()=>Math.max(-6,Math.min(14,Math.round((g.staffBottom-y)/H)));
  let hit=-1;
  b.items.forEach((it,i)=>{const p=L.pos[i];if(p.sys===si&&x>=p.x0&&x<p.x1)hit=i;});
  if(hit>=0){
    const it=b.items[hit];
    if(sel===hit&&!it.r&&!L.rh){const s=sFromY();if(s!==it.s){pushHist(n);it.s=s;save(n);}preview(b,hit);}
    else{sel=hit;preview(b,hit);}
  }else if(si===L.appendSys&&x>=L.appendX-14){
    pushHist(n);
    const it={d:input.d};if(input.dot)it.dot=true;
    if(input.rest)it.r=true;else if(!L.rh){it.s=sFromY();if(input.acc!=null)it.a=input.acc;}
    b.items.push(it);input.acc=null;sel=null;save(n);preview(b,b.items.length-1);
  }else{sel=null;}
  redrawStaff(b.id);
}

/* ---------- palette ---------- */
const pal=document.getElementById('palette');
function showPalette(on){
  if(!on){closeChord();}
  pal.hidden=!on;
  document.documentElement.style.setProperty('--pal-h',on?(pal.offsetHeight||170)+'px':'0px');
  if(on)updatePalette();
}
function updatePalette(){
  const b=activeId&&blockById(activeId);if(!b||b.type!=='staff')return;
  const rh=b.clef==='rhythm';const it=sel!=null?b.items[sel]:null;
  const d=it?it.d:input.d,dot=it?!!it.dot:input.dot,rest=it?!!it.r:input.rest,acc=it?(it.a??null):input.acc;
  pal.querySelectorAll('[data-dur]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.dur===d));
  pal.querySelector('[data-act=dot]').setAttribute('aria-pressed',dot);
  pal.querySelector('[data-act=rest]').setAttribute('aria-pressed',rest);
  pal.querySelectorAll('[data-acc]').forEach(x=>{x.hidden=rh;x.setAttribute('aria-pressed',acc!=null&&String(acc)===x.dataset.acc);});
  const info=document.getElementById('palInfo');
  if(it){info.textContent=it.r?'Silence sélectionné':(rh?'Note sélectionnée':pitchName(b.clef,it.s,it.a)+' · touchez plus haut ou plus bas pour la déplacer');}
  else info.textContent=rh?'Touchez la zone bleue pour ajouter':'Touchez la portée dans la zone bleue pour ajouter';
  document.documentElement.style.setProperty('--pal-h',(pal.offsetHeight||170)+'px');
}
function withSel(fn){const n=curNote(),b=activeId&&blockById(activeId);if(!n||!b)return;const it=sel!=null?b.items[sel]:null;if(it){pushHist(n);fn(it,b);save(n);redrawStaff(b.id);return true;}return false;}
pal.addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  const n=curNote(),b=activeId&&blockById(activeId);if(!n||!b)return;
  if(btn.dataset.dur){const d=btn.dataset.dur;if(!withSel(it=>{it.d=d;})){input.d=d;updatePalette();}else preview(b,sel);return;}
  if(btn.dataset.acc!=null&&btn.dataset.acc!==undefined&&btn.hasAttribute('data-acc')){const a=Number(btn.dataset.acc);
    if(!withSel(it=>{if(it.r)return;if(it.a===a)delete it.a;else it.a=a;})){input.acc=input.acc===a?null:a;updatePalette();}else preview(b,sel);return;}
  const act=btn.dataset.act;
  if(act==='dot'){if(!withSel(it=>{if(it.dot)delete it.dot;else it.dot=true;})){input.dot=!input.dot;updatePalette();}return;}
  if(act==='rest'){if(!withSel(it=>{if(it.r){delete it.r;if(b.clef!=='rhythm')it.s=it.s??4;}else{it.r=true;}})){input.rest=!input.rest;updatePalette();}return;}
  if(act==='prev'||act==='next'){if(!b.items.length)return;if(sel==null)sel=act==='prev'?b.items.length-1:0;else sel=Math.max(0,Math.min(b.items.length-1,sel+(act==='prev'?-1:1)));redrawStaff(b.id);preview(b,sel);return;}
  if(act==='undo'){undo();return;}
  if(act==='del'){if(!b.items.length)return;pushHist(n);if(sel!=null){b.items.splice(sel,1);if(sel>=b.items.length)sel=b.items.length?b.items.length-1:null;}else b.items.pop();save(n);redrawStaff(b.id);return;}
  if(act==='chord'){if(!b.items.length)return;openChord(b);return;}
});
document.getElementById('palDone').onclick=()=>{setActive(null);};
const chordBar=document.getElementById('chordBar'),chordIn=document.getElementById('chordIn');
let chordTarget=null;
function openChord(b){chordTarget={b,i:sel!=null?sel:b.items.length-1};if(sel==null){sel=chordTarget.i;redrawStaff(b.id);}chordIn.value=b.items[chordTarget.i].c||'';chordBar.hidden=false;updatePalette();chordIn.focus();}
function closeChord(){chordBar.hidden=true;chordTarget=null;}
function applyChord(){if(!chordTarget)return;const n=curNote();const {b,i}=chordTarget;const it=b.items[i];if(it&&n){pushHist(n);const v=chordIn.value.trim().slice(0,16);if(v)it.c=v;else delete it.c;save(n);}closeChord();chordIn.blur();redrawStaff(b.id);updatePalette();}
document.getElementById('chordOk').onclick=applyChord;
document.getElementById('chordCancel').onclick=()=>{closeChord();chordIn.blur();updatePalette();};
chordIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyChord();}});

let rz=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(lsTimer);try{localStorage.setItem(LS,JSON.stringify(notes))}catch(e){}}});
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view.name==='note'){const n=curNote();n&&n.blocks.forEach(b=>{if(b.type==='staff'){const w=app.querySelector(`[data-staff="${b.id}"]`);if(w&&w.clientWidth!==w._W)redrawStaff(b.id);}});}else renderList();},150);});

/* ---------- boot ---------- */
notes=lsRead();
Object.keys(notes).forEach(k=>{if(!notes[k]||!Array.isArray(notes[k].blocks))delete notes[k];});
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(view.name==='note'){const n=curNote();n&&n.blocks.forEach(b=>b.type==='staff'&&redrawStaff(b.id));}else renderList();});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
